[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragmate"
version = "0.1.0"
description = "Chat with your documents on a local model: learn RAG, LangChain and LangGraph by reading a small, working app."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Pramesh Bhattarai" }]
dependencies = [
    "langchain>=1.0",
    "langchain-core>=1.0",
    "langgraph>=1.0",
    "langchain-ollama>=1.0",
    "langchain-chroma>=1.0",
    "langchain-text-splitters>=1.0",
    "chromadb>=1.0",
    "pypdf>=5.0",
    "typer>=0.12",
    "rich>=13.7",
    "streamlit>=1.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
ragmate = "ragmate.cli:app"
ragmate-ui = "ragmate.cli:ui_main"

[tool.setuptools.packages.find]
include = ["ragmate*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
